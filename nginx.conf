# ══════════════════════════════════════════════════════════════════════════════
# GROVA — Nginx Configuration
# Ubuntu 22.04/24.04 + PHP-FPM
#
# 1. Copy to: /etc/nginx/sites-available/grova.io
# 2. Symlink:  sudo ln -s /etc/nginx/sites-available/grova.io /etc/nginx/sites-enabled/
# 3. SSL:      sudo certbot --nginx -d grova.io -d www.grova.io
# 4. Test:     sudo nginx -t
# 5. Reload:   sudo systemctl reload nginx
#
# Prerequisite packages:
#   sudo apt install nginx php8.3-fpm php8.3-mysql php8.3-mbstring php8.3-xml certbot python3-certbot-nginx
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name grova.io www.grova.io;

    # Redirect HTTP → HTTPS (certbot will add this automatically)
    return 301 https://grova.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grova.io www.grova.io;

    # ── SSL (certbot fills these in) ─────────────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/grova.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/grova.io/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Redirect www → non-www ───────────────────────────────────────────────
    if ($host = www.grova.io) {
        return 301 https://grova.io$request_uri;
    }

    # ── Document root ────────────────────────────────────────────────────────
    root /var/www/grova;     # CHANGE to your actual path
    index index.php;
    charset utf-8;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/grova.access.log;
    error_log  /var/log/nginx/grova.error.log;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"            always;
    add_header X-XSS-Protection        "1; mode=block"         always;
    add_header X-Content-Type-Options  "nosniff"               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Static file caching ──────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── robots.txt ───────────────────────────────────────────────────────────
    location = /robots.txt {
        allow all;
        access_log off;
        log_not_found off;
    }

    # ── Sitemap ──────────────────────────────────────────────────────────────
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    # ── Block sensitive files ────────────────────────────────────────────────
    location ~ ^/(config|schema)\.php$ {
        deny all;
        return 404;
    }
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }
    location ~ ^/data/ {
        deny all;
        return 404;
    }

    # ── Clean URL rewrites ───────────────────────────────────────────────────
    # /blog/post-slug → /post.php?slug=post-slug
    location ~ ^/blog/([a-z0-9\-]+)/?$ {
        rewrite ^ /post.php?slug=$1 last;
    }
    # /blog → /blog.php
    location = /blog {
        rewrite ^ /blog.php last;
    }
    # /product → /product.php
    location = /product {
        rewrite ^ /product.php last;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }

    # ── Default ──────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.php?$query_string =404;
    }

    # ── 404 → 404 page (optional) ───────────────────────────────────────────
    # error_page 404 /404.php;
}
